<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recipes — FoodLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- nav (keep your navbar if you prefer) -->
    <header style="top:0px;">
        <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
            <div class="container-fluid bg-light">
                <a class="navbar-brand fw-bold fs-3 text-primary mx-2" href="index.html">FoodLog</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link active mx-2" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link mx-2" href="#feature">Features</a></li>
                        <li class="nav-item"><a class="nav-link mx-2" href="#contacts">About Us / Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <!-- Features -->
        <section id="feature">
            <h3 class="title">Features that you can make use of with FoodLog:</h3>
            <div class="back">
                <button onclick="backButton()">👈</button>
                <h5>Recipe:</h5>
            </div>


        </section>

        <!-- Search + Filter -->
        <div class="row mb-4 g-2">
            <div class="col-md-6">
                <input id="recipeSearch" class="form-control" placeholder="Search recipes by name..." />
            </div>
            <div class="col-md-4">
                <select id="calorieFilter" class="form-select">
                    <option value="all">All calories</option>
                    <option value="lt200">Below 200 kcal</option>
                    <option value="200-400">200 - 400 kcal</option>
                    <option value="gt400">Above 400 kcal</option>
                </select>
            </div>
            <div class="col-md-2">
                <button id="resetRecipes" class="btn btn-outline-secondary w-100">Reset</button>
            </div>
        </div>

        <!-- Recipes Grid -->
        <div id="recipesGrid" class="row gy-4"></div>
    </main>

    <!-- Ingredients Modal -->
    <div class="modal fade" id="ingredientsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 id="modalRecipeTitle" class="modal-title">Recipe</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <img id="modalRecipeImg" src="" alt="" class="img-fluid rounded mb-3" />
                    <p><strong>Calories:</strong> <span id="modalRecipeCalories"></span> kcal</p>
                    <h6>Ingredients</h6>
                    <ul id="modalRecipeIngredients"></ul>
                    <h6 class="mt-3">Instructions</h6>
                    <p id="modalRecipeInstructions"></p>
                </div>
                <div class="modal-footer">
                    <button id="addToCalorieFromModal" type="button" class="btn btn-primary">Add to Calorie
                        Tracker</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- keep your reviews + footer if you want; omitted for brevity but you can keep your existing footer -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="recipes.js"></script>
    <script src="script.js"></script>
</body>

</html>
