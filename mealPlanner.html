<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Meal Planner — FoodLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header style="top:0px;">
        <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
            <div class="container-fluid bg-light">
                <a class="navbar-brand fw-bold fs-3 text-primary  mx-2" href="index.html">FoodLog</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            
                        </li>

                        <li class="nav-item dropdown">
                            <div id="google_translate_element">
                                <div class="skiptranslate goog-te-gadget" dir="ltr" >
                                    <div id=":0.targetLanguage"></div>
                                    <span style="white-space:nowrap">
                                        
                                    </span>
                                </div>
                            </div>
                            <script type="text/javascript">
                                function googleTranslateElementInit() {
                                    new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
                                }
                            </script>
                            <script type="text/javascript"
                                src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <!-- Features -->
        <section id="feature">
            <h3 class="title">Features that you can make use of with FoodLog:</h3>
            <div class="back">
                <button onclick="backButton()">👈</button>
                <h5>Meal Planner:</h5>
            </div>


        </section>

        <div class="card p-3 mb-4">
            <form id="plannerForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Enter your BMI</label>
                    <input id="userBmi" type="number" step="0.1" min="10" class="form-control" placeholder="e.g., 23.4"
                        required />
                </div>

                <div class="col-md-4">
                    <label class="form-label">Goal</label>
                    <select id="userGoal" class="form-select" required>
                        <option value="">Choose goal</option>
                        <option value="lose">Lose weight</option>
                        <option value="maintain">Maintain</option>
                        <option value="gain">Gain weight</option>
                    </select>
                </div>

                <div class="col-md-4 d-flex align-items-end">
                    <button class="btn btn-primary w-100" type="submit">Get Plan</button>
                </div>
            </form>
        </div>

        <div id="planResult" class="card p-3 d-none">
            <h5>Recommended daily calories: <span id="recommendedCalories"></span> kcal</h5>
            <p id="estimationText" class="text-muted"></p>

            <h6 class="mt-3">7-day Sample Meal Plan</h6>
            <div id="weeklyPlan" class="mt-2"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="recipes.js"></script>
    <script src="script.js"></script>
</body>

</html>
