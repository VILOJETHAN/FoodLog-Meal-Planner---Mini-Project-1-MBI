<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Calorie Tracker — FoodLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header style="top:0px;">
        <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
            <div class="container-fluid bg-light">
                <a class="navbar-brand fw-bold fs-3 text-primary  mx-2" href="index.html">FoodLog</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav">
                        <li class="nav-item">

                        </li>

                        <li class="nav-item dropdown">
                            <div id="google_translate_element">
                                <div class="skiptranslate goog-te-gadget" dir="ltr" >
                                    <div id=":0.targetLanguage"></div>
                                    <span style="white-space:nowrap">

                                    </span>
                                </div>
                            </div>
                            <script type="text/javascript">
                                function googleTranslateElementInit() {
                                    new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
                                }
                            </script>
                            <script type="text/javascript"
                                src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <!-- Features -->
        <section id="feature">
            <h3 class="title">Features that you can make use of with FoodLog:</h3>
            <div class="back">
                <button onclick="backButton()">👈</button>
                <h5>Calorie Tracker:</h5>
            </div>


        </section>

        <!-- Form: can autofill from recipes -->
        <div class="card p-3 mb-4">
            <form id="calorieForm" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Pick recipe (optional)</label>
                    <select id="recipeSelect" class="form-select">
                        <option value="">— choose recipe to autofill —</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Food name</label>
                    <input id="foodName" class="form-control" placeholder="e.g., Grilled Chicken" required />
                </div>

                <div class="col-md-2">
                    <label class="form-label">Calories (kcal)</label>
                    <input id="foodCalories" type="number" class="form-control" min="0" required />
                </div>

                <div class="col-md-12">
                    <label class="form-label">Ingredients / notes</label>
                    <textarea id="foodIngredients" class="form-control" rows="2"
                        placeholder="Ingredients or extra details"></textarea>
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </div>
                <div class="col-md-2">
                    <button id="clearTrackerBtn" type="button" class="btn btn-outline-danger w-100">Clear</button>
                </div>
            </form>
        </div>

        <!-- Table -->
        <div class="card p-3">
            <h5>Total calories today: <span id="totalCalories">0</span> kcal</h5>
            <div class="table-responsive">
                <table id="trackerTable" class="table table-striped mt-3">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Food</th>
                            <th>Calories</th>
                            <th>Ingredients</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="recipes.js"></script>
    <script src="script.js"></script>

</body>

</html>
